[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "order-book-harness"
version = "0.1.0"
description = "Deterministic self-improving harness for passive LOBSTER order placement"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
obh = "order_book_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

